<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primavera Sound 2026 — Recomendador</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0ede8;
    --text-muted: rgba(240,237,232,0.5);
    --accent: #c8f55a;
    --accent-dim: rgba(200,245,90,0.12);
    --accent2: #ff6b4a;
    --pill-bg: rgba(200,245,90,0.1);
    --pill-text: #c8f55a;
    --similar-bg: rgba(255,107,74,0.1);
    --similar-text: #ff9070;
    --genres-bg: rgba(130,80,255,0.12);
    --genres-text: #a67fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 2rem 2.5rem;
    display: flex;
    align-items: flex-end;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .logo-block h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text);
  }

  .logo-block h1 span { color: var(--accent); }

  .logo-block p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-search {
    flex: 1;
    min-width: 260px;
    max-width: 480px;
  }

  .search-wrap {
    position: relative;
    display: flex;
    gap: 10px;
  }

  .search-wrap input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 0.75rem 1.1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text-muted); }

  .search-wrap button {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.4rem;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .search-wrap button:hover { opacity: 0.88; }
  .search-wrap button:active { transform: scale(0.97); }

  #autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }

  .ac-item {
    padding: 0.6rem 1rem;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    transition: background 0.1s;
  }

  .ac-item:hover, .ac-item.active { background: var(--accent-dim); color: var(--accent); }

  main { padding: 2.5rem; }

  #status {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 1.5rem;
    min-height: 20px;
  }

  #status.error { color: var(--accent2); }
  #status.loading { color: var(--accent); }

  /* ── Controls bar ────────────────────────────────────────────────────────── */
  .controls-bar {
    display: flex;
    align-items: flex-end;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
  }

  .param-group { display: flex; flex-direction: column; gap: 4px; }
  .param-group label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }

  .param-group input[type=number] {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 0.45rem 0.8rem;
    outline: none;
    width: 80px;
  }

  /* Sort toggle */
  .sort-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
    align-self: flex-end;
  }

  .sort-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sort-btn:first-child { border-right: 1px solid var(--border2); }

  .sort-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .sort-btn svg { flex-shrink: 0; }

  /* ── Route mode: timeline layout ─────────────────────────────────────────── */
  .days-grid { display: flex; flex-direction: column; gap: 2.5rem; }

  .day-block {}

  .day-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .day-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .day-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
  }

  /* Grid mode (sort by match) */
  .artists-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  /* Route/timeline mode (sort by time) */
  .artists-timeline {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Artist card — grid mode ─────────────────────────────────────────────── */
  .artist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }

  .artist-card:hover {
    border-color: var(--border2);
    transform: translateY(-2px);
  }

  .artist-card.layer-similar { border-color: rgba(200,245,90,0.25); }

  .artist-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    cursor: default;
  }

  .artist-img-wrap.has-preview { cursor: pointer; }

  .artist-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: var(--surface2);
    display: block;
    transition: transform 0.35s ease;
  }

  .artist-img-wrap.has-preview:hover .artist-img { transform: scale(1.04); }

  .artist-img-placeholder {
    width: 100%;
    height: 100%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: rgba(255,255,255,0.1);
  }

  .img-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.52);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }

  .artist-img-wrap.has-preview:hover .img-overlay { opacity: 1; }
  .artist-img-wrap.is-playing .img-overlay { opacity: 1; }

  .overlay-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: background 0.15s, border-color 0.15s;
  }

  .artist-img-wrap.is-playing .overlay-icon {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0a;
  }

  .wave-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
  }

  .wave-bars span {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    animation: wave 0.9s ease-in-out infinite;
    transform-origin: bottom;
  }

  .wave-bars span:nth-child(1) { animation-delay: 0s;    height: 6px; }
  .wave-bars span:nth-child(2) { animation-delay: 0.15s; height: 10px; }
  .wave-bars span:nth-child(3) { animation-delay: 0.3s;  height: 14px; }
  .wave-bars span:nth-child(4) { animation-delay: 0.15s; height: 10px; }
  .wave-bars span:nth-child(5) { animation-delay: 0s;    height: 6px; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50%       { transform: scaleY(1); }
  }

  .overlay-track {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    max-width: 90%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist-info {
    padding: 0.9rem;
  }

  .artist-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.2;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .artist-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 0.5rem;
  }

  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge-similar { background: var(--pill-bg); color: var(--pill-text); }
  .badge-tags    { background: var(--similar-bg); color: var(--similar-text); }
  .badge-tag     { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .badge-genres  { background: rgba(130,80,255,0.12); color: #a67fff; }

  .score-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .score-fill.tags { background: var(--accent2); }
  .score-fill.genres { background: #a67fff; }

  .artist-footer {
    padding: 0 0.9rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .popularity-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pop-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .pop-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .pop-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .pop-fill.high { background: #c8f55a; }
  .pop-fill.mid  { background: #888780; }
  .pop-fill.low  { background: #444441; }

  .pop-value {
    font-size: 10px;
    color: var(--text-muted);
    min-width: 20px;
    text-align: right;
  }

  .preview-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-progress {
    width: 100%;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
    display: block;
  }

  .preview-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }

  /* ── Schedule pills (shared) ─────────────────────────────────────────────── */
  .card-schedule {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .card-time {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .card-stage {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 130px;
  }

  /* ── Route card (timeline mode) ──────────────────────────────────────────── */
  .route-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    transition: border-color 0.2s, transform 0.1s;
  }

  .route-card:hover { border-color: var(--border2); transform: translateX(2px); }
  .route-card.layer-similar { border-color: rgba(200,245,90,0.25); }

  /* Left: time column */
  .route-time-col {
    width: 72px;
    flex-shrink: 0;
    background: var(--surface2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 0.5rem;
    gap: 4px;
  }

  .route-time {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .route-time.no-time {
    font-size: 1.2rem;
    color: var(--border2);
  }

  .route-time-end {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: -0.01em;
  }

  .route-stage-pill {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-align: center;
    max-width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
  }

  /* Middle: image */
  .route-img-wrap {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    cursor: default;
    align-self: center;
    margin: 0.6rem 0.75rem 0.6rem 0.75rem;
    border-radius: 6px;
  }

  .route-img-wrap.has-preview { cursor: pointer; }

  .route-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .route-img-wrap.has-preview:hover .route-img { transform: scale(1.06); }

  .route-img-placeholder {
    width: 100%;
    height: 100%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: rgba(255,255,255,0.1);
    border-radius: 6px;
  }

  .route-play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.18s;
    pointer-events: none;
  }

  .route-img-wrap.has-preview:hover .route-play-overlay { opacity: 1; }
  .route-img-wrap.is-playing .route-play-overlay { opacity: 1; }

  .route-play-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .route-img-wrap.is-playing .route-play-icon {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0a;
  }

  /* Right: info */
  .route-info {
    flex: 1;
    min-width: 0;
    padding: 0.7rem 0.9rem 0.7rem 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  .route-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .route-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .route-tags-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .route-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .route-score-bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    max-width: 100px;
  }

  .route-score-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }

  .route-score-fill.tags { background: var(--accent2); }
  .route-score-fill.genres { background: #a67fff; }

  .route-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    padding: 0.7rem 0.9rem 0.7rem 0;
    gap: 6px;
    flex-shrink: 0;
  }

  .route-spotify {
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s;
  }

  .route-spotify:hover { color: var(--accent); }

  .route-pop {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .route-pop-bar {
    width: 40px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .route-pop-fill {
    height: 100%;
    border-radius: 2px;
  }

  .route-pop-val {
    font-size: 10px;
    color: var(--text-muted);
    min-width: 18px;
    text-align: right;
  }

  .route-preview-bar {
    width: 80px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }

  .route-preview-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }

  /* ── Empty / initial states ──────────────────────────────────────────────── */
  #empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
    display: none;
  }

  #empty-state h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  #initial-state {
    text-align: center;
    padding: 5rem 2rem;
  }

  #initial-state h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.75rem;
  }

  #initial-state p { color: var(--text-muted); max-width: 440px; margin: 0 auto; }

  .upload-section {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .upload-btn {
    background: transparent;
    border: 1px dashed var(--border2);
    border-radius: 10px;
    padding: 1.2rem 2rem;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .upload-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .upload-note { font-size: 12px; color: var(--text-muted); }

  .legend {
    display: flex;
    gap: 1.2rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-similar { background: var(--accent); }
  .dot-tags { background: var(--accent2); }
  .dot-genres { background: #a67fff; }

  /* ── Artist card buscado ─────────────────────────────────────────────────── */
  #artist-card-wrap { display: none; margin-bottom: 2.5rem; }

  .searched-card {
    background: var(--surface);
    border: 1px solid rgba(200,245,90,0.3);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sc-hero { display: flex; gap: 0; }

  .sc-img {
    width: 160px; height: 160px;
    object-fit: cover; flex-shrink: 0; display: block;
  }

  .sc-img-placeholder {
    width: 160px; height: 160px;
    background: var(--surface2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-size: 3rem;
    font-weight: 800; color: rgba(255,255,255,0.08);
  }

  .sc-body {
    padding: 1.2rem 1.4rem; flex: 1;
    display: flex; flex-direction: column;
    justify-content: space-between; gap: 0.75rem;
  }

  .sc-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.2rem; }

  .sc-spotify:hover { color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 1.5rem; }
    main { padding: 1.5rem; }
    .artists-grid { grid-template-columns: 1fr 1fr; }
    .sc-img, .sc-img-placeholder { width: 110px; height: 110px; }
    .sc-name { font-size: 1.1rem; }
    .route-time-col { width: 58px; }
    .route-img-wrap { width: 52px; height: 52px; margin: 0.5rem 0.5rem 0.5rem 0.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <h1>Primavera<span>.</span></h1>
    <p>Recomendador 2026</p>
  </div>
  <div class="header-search">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Busca un artista..." autocomplete="off" />
      <button onclick="runSearch()">Recomendar</button>
      <div id="autocomplete-list"></div>
    </div>
  </div>
</header>

<main>
  <div id="initial-state" style="display:none"></div>

  <div id="app-area" style="display:none">
    <div class="controls-bar">
      <div class="param-group">
        <label>Tags mínimos compartidos</label>
        <input type="number" id="min-tags" value="2" min="1" max="5">
      </div>
      <div class="param-group">
        <label>Máx. por día</label>
        <input type="number" id="top-per-day" value="10" min="1" max="30">
      </div>
      <div class="param-group">
        <label>Ordenar por</label>
        <div class="sort-toggle">
          <button class="sort-btn" id="btn-sort-time" onclick="setSortMode('time')">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6l1.5 1.5"/></svg>
            Ruta
          </button>
          <button class="sort-btn active" id="btn-sort-match" onclick="setSortMode('match')">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 10 L5 7 L7 9 L10 5"/></svg>
            Match
          </button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <div id="artist-card-wrap"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot dot-similar"></div> Similares directos (Last.fm)</div>
      <div class="legend-item"><div class="legend-dot dot-tags"></div> Tags compartidos</div>
      <div class="legend-item"><div class="legend-dot dot-genres"></div> Géneros Spotify</div>
    </div>
    <div class="days-grid" id="results"></div>
    <div id="empty-state">
      <h2>Sin resultados</h2>
      <p>No hay artistas en el lineup similares a este. Prueba con otro nombre.</p>
    </div>
<!-- ── Genre Explorer ──────────────────────────────────────────────────── -->
  <div id="genre-section" style="display:none; margin-top: 3rem;">
    <div style="border-top: 1px solid var(--border); padding-top: 2.5rem;">
      <div style="margin-bottom: 1.5rem;">
        <div style="font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem;">Explorar por género</div>
        <div style="font-size: 12px; color: var(--text-muted);">Busca un género (shoegaze, post-punk, techno…) o un tag de Last.fm</div>
      </div>
      <div class="genre-search-wrap" style="position: relative; display: flex; gap: 10px; max-width: 480px; margin-bottom: 1.2rem;">
        <input type="text" id="genre-input" placeholder="shoegaze, post-punk, techno…"
          autocomplete="off"
          style="flex:1; background:var(--surface); border:1px solid var(--border2); border-radius:8px; padding:0.75rem 1.1rem; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none;"
          onkeydown="if(event.key==='Enter') runGenreSearch()"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='var(--border2)'"
        />
        <button onclick="runGenreSearch()"
          style="background:var(--accent); color:#0a0a0a; border:none; border-radius:8px; padding:0.75rem 1.4rem; font-family:'Syne',sans-serif; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;">
          Buscar
        </button>
        <div id="genre-ac-list"
          style="position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; max-height:260px; overflow-y:auto; z-index:100; display:none;">
        </div>
      </div>
      <div id="genre-status" style="font-size:13px; color:var(--text-muted); margin-bottom:1.5rem; min-height:20px;"></div>
      <div class="days-grid" id="genre-results"></div>
    </div>
  </div>
  </div>
</main>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let df = [];
let artistNames = [];
let sortMode = 'match'; // 'match' | 'time'
let lastResults = {}; // byDay cache to re-render without re-computing

// ── CSV parsing ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, j) => { obj[h.trim()] = (vals[j] || '').trim(); });
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; continue; }
    if (c === ',' && !inQuotes) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function loadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    df = parseCSV(e.target.result);
    artistNames = df.map(r => r.artist).filter(Boolean);
    document.getElementById('initial-state').style.display = 'none';
    document.getElementById('app-area').style.display = 'block';
    setStatus(`${df.length} artistas cargados desde ${file.name}`, 'ok');
  };
  reader.readAsText(file, 'utf-8');
}



// ── Sort mode ────────────────────────────────────────────────────────────────
function setSortMode(mode) {
  sortMode = mode;
  document.getElementById('btn-sort-time').classList.toggle('active', mode === 'time');
  document.getElementById('btn-sort-match').classList.toggle('active', mode === 'match');
  if (Object.keys(lastResults).length) renderResults(lastResults);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type === 'error' ? 'error' : type === 'loading' ? 'loading' : '';
}

function normalize(s) {
  return String(s).replace(/\s+/g, ' ').trim().toLowerCase();
}

function parsePipeStr(val) {
  if (!val || String(val).trim() === '') return [];
  return String(val).split('|').map(x => x.trim()).filter(Boolean);
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function formatFollowers(n) {
  n = parseInt(n);
  if (isNaN(n)) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'k';
  return String(n);
}

function formatDate(d) {
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const days = ['dom','lun','mar','mié','jue','vie','sáb'];
  const dt = new Date(d.includes('/') ? d.split('/').reverse().join('-') + 'T12:00:00' : d + 'T12:00:00');
  if (isNaN(dt)) return d;
  return `${days[dt.getDay()]} ${dt.getDate()} ${months[dt.getMonth()]}`;
}

/**
 * Parse time string like "22:30", "22h30", "10:00 PM" to minutes since midnight.
 * Returns Infinity if unparseable (unknown times go to end).
 */
function timeToMinutes(t) {
  if (!t || t.trim() === '') return Infinity;
  // Handle "HH:MM" or "HHhMM"
  const m = String(t).match(/(\d{1,2})[:\s]?h?\s?(\d{2})/i);
  if (!m) return Infinity;
  let h = parseInt(m[1]);
  const min = parseInt(m[2]);
  // Festival times: acts after midnight (00:xx–05:xx) sort after late-night (23:xx)
  // Treat 00–05 as 24–29 so the order is: 17h, 18h, ..., 23h, 00h, 01h, ...
  if (h >= 0 && h <= 5) h += 24;
  return h * 60 + min;
}

// ── Recommendation engine ─────────────────────────────────────────────────
function findAsSimilar(artist) {
  const artistNorm = normalize(artist);
  const results = [];
  const seen = new Set();

  for (const row of df) {
    const candidate = row.artist;
    if (!candidate) continue;
    const candNorm = normalize(candidate);
    if (candNorm === artistNorm) continue;

    const similars = parsePipeStr(row.lastfm_similar);
    const rawScores = parsePipeStr(row.lastfm_similar_scores);
    const scores = rawScores.map(s => parseFloat(s) || 0);

    for (let i = 0; i < similars.length; i++) {
      if (normalize(similars[i]) !== artistNorm) continue;
      const key = candNorm + '|' + artistNorm;
      if (seen.has(key)) break;
      seen.add(key);
      const score = scores[i] || 0;
      const posBonus = 1 / (i + 1);
      const strength = score > 0 ? score * posBonus : posBonus;
      results.push({
        artist: candidate, date: row.date || '',
        start_time: row.start_time || '', end_time: row.end_time || '', stage: row.stage || '',
        lastfm_score: score, position: i + 1,
        strength: strength + 1,
        source: 'similar',
        shared_tags: '', lastfm_tags: row.lastfm_tags || '',
        popularity: row.popularity || '',
        image_url: row.image_url || '',
        spotify_url: row.spotify_url || '',
        preview_url: row.preview_url || '',
        top_track: row.top_track || '',
        followers: row.followers || '',
      });
      break;
    }
  }
  return results;
}

function findByTags(artist, minShared) {
  const artistRow = df.find(r => normalize(r.artist) === normalize(artist));
  if (!artistRow) return [];
  const artistTags = new Set(parsePipeStr(artistRow.lastfm_tags).map(normalize).filter(Boolean));
  if (!artistTags.size) return [];

  const results = [];
  for (const row of df) {
    if (!row.artist || normalize(row.artist) === normalize(artist)) continue;
    const candTags = new Set(parsePipeStr(row.lastfm_tags).map(normalize).filter(Boolean));
    const shared = [...artistTags].filter(t => candTags.has(t));
    if (shared.length < minShared) continue;
    const tagScore = shared.length / artistTags.size;
    results.push({
      artist: row.artist, date: row.date || '',
      start_time: row.start_time || '', end_time: row.end_time || '', stage: row.stage || '',
      lastfm_score: 0, position: null,
      strength: tagScore * 0.5 * shared.length,
      source: 'tags',
      shared_tags: shared.join(' | '),
      lastfm_tags: row.lastfm_tags || '',
      popularity: row.popularity || '',
      image_url: row.image_url || '',
      spotify_url: row.spotify_url || '',
      preview_url: row.preview_url || '',
      top_track: row.top_track || '',
      tag_score: tagScore,
      followers: row.followers || '',
    });
  }
  return results;
}

function recommend(artist, minSharedTags, topPerDay) {
  const layer1 = findAsSimilar(artist);
  const layer1Artists = new Set(layer1.map(r => normalize(r.artist)));
  const layer2 = findByTags(artist, minSharedTags).filter(r => !layer1Artists.has(normalize(r.artist)));
  const layer12Artists = new Set([...layer1, ...layer2].map(r => normalize(r.artist)));
  const layer3 = findByGenres(artist, 1).filter(r => !layer12Artists.has(normalize(r.artist)));

  if (!layer1.empty && !layer1.length === 0) layer1.forEach(r => r.strength = r.strength); // already +1
  if (layer2.length) layer2.forEach(r => r.source = 'tags');
  if (layer3.length) layer3.forEach(r => r.source = 'genres');

  const combined = [...layer1, ...layer2, ...layer3];
  if (!combined.length) return {};

  // Primary sort: always group by day first
  combined.sort((a, b) => {
    const dateCmp = normDate(a.date).localeCompare(normDate(b.date));
    if (dateCmp !== 0) return dateCmp;
    return b.strength - a.strength; // within day, strength order for topPerDay cutoff
  });

  const byDay = {};
  for (const r of combined) {
    const key = r.date;
    if (!byDay[key]) byDay[key] = [];
    if (byDay[key].length < topPerDay) byDay[key].push(r);
  }
  return byDay;
}

// Normalize date string for sorting (handle DD/MM/YYYY and YYYY-MM-DD)
function normDate(d) {
  if (!d) return '';
  if (d.includes('/')) {
    const p = d.split('/');
    return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
  }
  return d;
}

// ── Audio ─────────────────────────────────────────────────────────────────
let currentAudio = null;
let currentWrap = null;
let hoverTimer = null;

function stopCurrentAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
  if (currentWrap) {
    currentWrap.classList.remove('is-playing');
    // reset grid card progress bar
    const prog = currentWrap.closest('.artist-card')?.querySelector('.preview-progress-fill');
    if (prog) prog.style.width = '0%';
    // reset route card progress bar
    const routeProg = currentWrap.closest('.route-card')?.querySelector('.route-preview-fill');
    if (routeProg) routeProg.style.width = '0%';
    currentWrap = null;
  }
}

function playIconSvg() { return `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="2,1 11,6 2,11"/></svg>`; }
function pauseIconSvg() { return `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1.5" y="1" width="3.5" height="10" rx="1.2"/><rect x="7" y="1" width="3.5" height="10" rx="1.2"/></svg>`; }

function startPreview(wrap, previewUrl) {
  if (currentWrap === wrap) return;
  stopCurrentAudio();
  if (scAudio && !scAudio.paused) { scAudio.pause(); updateScBtn(false); clearInterval(scTimer); }

  const audio = new Audio(previewUrl);
  currentAudio = audio;
  currentWrap = wrap;
  wrap.classList.add('is-playing');
  const icon = wrap.querySelector('.overlay-icon, .route-play-icon');
  if (icon) icon.innerHTML = pauseIconSvg();

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration * 100).toFixed(1) + '%';
    // grid card
    const gp = wrap.closest('.artist-card')?.querySelector('.preview-progress-fill');
    if (gp) gp.style.width = pct;
    // route card
    const rp = wrap.closest('.route-card')?.querySelector('.route-preview-fill');
    if (rp) { rp.style.width = pct; rp.parentElement.style.display = 'block'; }
  };
  audio.onended = () => stopCurrentAudio();
  audio.onerror = () => stopCurrentAudio();
  audio.play().catch(() => stopCurrentAudio());
}

function onImgClick(wrap, previewUrl) {
  if (!previewUrl) return;
  if (currentWrap === wrap) { stopCurrentAudio(); return; }
  startPreview(wrap, previewUrl);
}

// Kept for CSS hover effects only — no audio on hover
function onImgMouseEnter(wrap, previewUrl) {}
function onImgMouseLeave(wrap) {}

// ── Render: grid card ─────────────────────────────────────────────────────
function renderGridCard(r) {
  const maxStrength = 2.5;
  const pct = Math.min(100, Math.round((r.strength / maxStrength) * 100));
  const isImg = r.image_url && r.image_url.startsWith('http');
  const hasPreview = r.preview_url && r.preview_url.startsWith('http');

  const imgInner = isImg
    ? `<img class="artist-img" src="${r.image_url}" alt="${r.artist}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">
       <div class="artist-img-placeholder" style="display:none">${initials(r.artist)}</div>`
    : `<div class="artist-img-placeholder">${initials(r.artist)}</div>`;

  const overlayIcon = hasPreview
    ? `<div class="img-overlay">
         <div class="overlay-icon">${playIconSvg()}</div>
         <div class="wave-bars"><span></span><span></span><span></span><span></span><span></span></div>
         ${r.top_track ? `<div class="overlay-track">${r.top_track}</div>` : ''}
       </div>`
    : '';

  const previewAttrs = hasPreview
    ? `class="artist-img-wrap has-preview" onclick="onImgClick(this,'${r.preview_url}')" onmouseenter="onImgMouseEnter(this,'${r.preview_url}')" onmouseleave="onImgMouseLeave(this)"`
    : `class="artist-img-wrap"`;

  const sourceBadge = r.source === 'similar'
    ? `<span class="badge badge-similar">similares</span>`
    : r.source === 'genres'
    ? `<span class="badge badge-genres">géneros</span>`
    : `<span class="badge badge-tags">tags</span>`;

  const sharedTagsHtml = r.source === 'tags' && r.shared_tags
    ? r.shared_tags.split('|').slice(0,3).map(t => `<span class="badge badge-tag">${t.trim()}</span>`).join('')
    : '';

  const fillClass = r.source === 'tags' ? 'score-fill tags' : r.source === 'genres' ? 'score-fill genres' : 'score-fill';

  const spotifyLink = r.spotify_url
    ? `<a href="${r.spotify_url}" target="_blank" rel="noopener" style="font-size:11px;color:var(--text-muted);text-decoration:none;">↗ Spotify</a>`
    : '';

  const pop = parseInt(r.popularity) || 0;
  const popClass = pop >= 65 ? 'high' : pop >= 35 ? 'mid' : 'low';
  const popHtml = pop > 0 ? `
    <div class="popularity-row">
      <span class="pop-label">pop</span>
      <div class="pop-bar"><div class="pop-fill ${popClass}" style="width:${pop}%"></div></div>
      <span class="pop-value">${pop}</span>
    </div>` : '';

  const scheduleHtml = (r.start_time || r.stage) ? `
    <div class="card-schedule">
      ${r.start_time ? `<span class="card-time">${r.start_time}${r.end_time ? ` → ${r.end_time}` : ''}</span>` : ''}
      ${r.start_time && r.stage ? `<span style="color:var(--border2);font-size:10px">·</span>` : ''}
      ${r.stage ? `<span class="card-stage">${r.stage}</span>` : ''}
    </div>` : '';

  const footerHtml = (popHtml || spotifyLink) ? `
    <div class="artist-footer">
      ${popHtml}
      ${spotifyLink ? `<div class="preview-row" style="justify-content:flex-end">${spotifyLink}</div>` : ''}
      ${hasPreview ? `<div class="preview-progress"><div class="preview-progress-fill"></div></div>` : ''}
    </div>` : (hasPreview ? `<div class="artist-footer"><div class="preview-progress"><div class="preview-progress-fill"></div></div></div>` : '');

  return `<div class="artist-card ${r.source === 'similar' ? 'layer-similar' : ''}">
    <div ${previewAttrs}>${imgInner}${overlayIcon}</div>
    <div class="artist-info">
      <div class="artist-name">${r.artist}</div>
      ${scheduleHtml}
      <div class="artist-meta" style="margin-top:6px">${sourceBadge}${sharedTagsHtml}</div>
      <div class="score-bar"><div class="${fillClass}" style="width:${pct}%"></div></div>
    </div>
    ${footerHtml}
  </div>`;
}

// ── Render: route card (timeline) ─────────────────────────────────────────
function renderRouteCard(r) {
  const maxStrength = 2.5;
  const pct = Math.min(100, Math.round((r.strength / maxStrength) * 100));
  const isImg = r.image_url && r.image_url.startsWith('http');
  const hasPreview = r.preview_url && r.preview_url.startsWith('http');

  const imgContent = isImg
    ? `<img class="route-img" src="${r.image_url}" alt="${r.artist}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">
       <div class="route-img-placeholder" style="display:none">${initials(r.artist)}</div>`
    : `<div class="route-img-placeholder">${initials(r.artist)}</div>`;

  const playOverlay = hasPreview
    ? `<div class="route-play-overlay"><div class="route-play-icon">${playIconSvg()}</div></div>`
    : '';

  const imgWrapAttrs = hasPreview
    ? `class="route-img-wrap has-preview" onclick="onImgClick(this,'${r.preview_url}')" onmouseenter="onImgMouseEnter(this,'${r.preview_url}')" onmouseleave="onImgMouseLeave(this)"`
    : `class="route-img-wrap"`;

  const timeDisplay = r.start_time
    ? `<div class="route-time">${r.start_time}</div>${r.end_time ? `<div class="route-time-end">${r.end_time}</div>` : ''}`
    : `<div class="route-time no-time">–</div>`;

  const stageDisplay = r.stage
    ? `<div class="route-stage-pill">${r.stage}</div>`
    : '';

  const sourceBadge = r.source === 'similar'
    ? `<span class="badge badge-similar" style="font-size:10px;padding:1px 6px">similares</span>`
    : r.source === 'genres'
    ? `<span class="badge badge-genres" style="font-size:10px;padding:1px 6px">géneros</span>`
    : `<span class="badge badge-tags" style="font-size:10px;padding:1px 6px">tags</span>`;

  const sharedTagsHtml = r.source === 'tags' && r.shared_tags
    ? r.shared_tags.split('|').slice(0,2).map(t => `<span class="badge badge-tag" style="font-size:10px;padding:1px 6px">${t.trim()}</span>`).join('')
    : '';

  const fillClass = r.source === 'tags' ? 'route-score-fill tags' : r.source === 'genres' ? 'route-score-fill genres' : 'route-score-fill';

  const pop = parseInt(r.popularity) || 0;
  const popClass = pop >= 65 ? 'high' : pop >= 35 ? 'mid' : 'low';

  const rightCol = `
    <div class="route-right">
      ${r.spotify_url ? `<a class="route-spotify" href="${r.spotify_url}" target="_blank" rel="noopener">↗ Spotify</a>` : ''}
      ${pop > 0 ? `<div class="route-pop">
        <div class="route-pop-bar"><div class="route-pop-fill ${popClass}" style="width:${pop}%"></div></div>
        <span class="route-pop-val">${pop}</span>
      </div>` : ''}
      ${hasPreview ? `<div class="route-preview-bar"><div class="route-preview-fill"></div></div>` : ''}
    </div>`;

  return `<div class="route-card ${r.source === 'similar' ? 'layer-similar' : ''}">
    <div class="route-time-col">
      ${timeDisplay}
      ${stageDisplay}
    </div>
    <div ${imgWrapAttrs}>${imgContent}${playOverlay}</div>
    <div class="route-info">
      <div class="route-name">${r.artist}</div>
      <div class="route-meta">${sourceBadge}${sharedTagsHtml}</div>
      <div class="route-bar-row">
        <div class="route-score-bar"><div class="${fillClass}" style="width:${pct}%"></div></div>
      </div>
    </div>
    ${rightCol}
  </div>`;
}

// ── Render results ────────────────────────────────────────────────────────
function renderResults(byDay) {
  const dates = Object.keys(byDay).sort((a, b) => normDate(a).localeCompare(normDate(b)));

  if (!dates.length) {
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  const isRoute = sortMode === 'time';

  const html = dates.map(date => {
    let items = [...byDay[date]];

    if (isRoute) {
      // Sort by time within day; unknown times go to end
      items.sort((a, b) => timeToMinutes(a.start_time) - timeToMinutes(b.start_time));
    }
    // else keep strength order (already set at compute time)

    const cardsHtml = isRoute
      ? items.map(renderRouteCard).join('')
      : items.map(renderGridCard).join('');

    const wrapClass = isRoute ? 'artists-timeline' : 'artists-grid';

    return `<div class="day-block">
      <div class="day-header">
        <span class="day-label">${formatDate(date)}</span>
        <span class="day-count">${items.length} artistas</span>
      </div>
      <div class="${wrapClass}">${cardsHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('results').innerHTML = html;
}

// ── Searched artist card ──────────────────────────────────────────────────
let scAudio = null;
let scTimer = null;

function renderArtistCard(row) {
  const name       = row.artist || '';
  const dateLabel  = formatDate(row.date || '');
  const startTime  = row.start_time || '';
  const endTime    = row.end_time || '';
  const stage      = row.stage || '';
  const imageUrl   = row.image_url || '';
  const topTrack   = row.top_track || '';
  const previewUrl = row.preview_url || '';
  const spotifyUrl = row.spotify_url || '';
  const followers  = formatFollowers(row.followers);
  const pop        = parseInt(row.popularity) || 0;

  const rawTags = row.lastfm_tags || row.genres || '';
  const sep = rawTags.includes('|') ? '|' : ',';
  const tags = rawTags.split(sep).map(t => t.trim()).filter(Boolean).slice(0, 5);

  const imgHtml = imageUrl
    ? `<img class="sc-img" src="${imageUrl}" alt="${name}" onerror="this.style.display='none';document.getElementById('sc-ph').style.display='flex';">
       <div class="sc-img-placeholder" id="sc-ph" style="display:none">${initials(name)}</div>`
    : `<div class="sc-img-placeholder" id="sc-ph">${initials(name)}</div>`;

  const scheduleHtml = (startTime || stage) ? `
    <div class="sc-schedule">
      ${startTime ? `<span class="sc-time">${startTime}${endTime ? ` → ${endTime}` : ''}</span>` : ''}
      ${startTime && stage ? `<span style="color:var(--border2);font-size:11px;">·</span>` : ''}
      ${stage ? `<span class="sc-stage">${stage}</span>` : ''}
    </div>` : '';

  const footerHtml = (previewUrl && topTrack) ? `
    <div class="sc-footer">
      <button class="sc-play-btn" id="sc-play-btn" onclick="scTogglePlay()" aria-label="Reproducir preview">
        <svg id="sc-play-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><polygon points="3,1 13,7 3,13"/></svg>
      </button>
      <div class="sc-track">
        <div class="sc-track-name">${topTrack}</div>
        <div class="sc-track-label">canción más popular · preview 30s</div>
      </div>
      <div class="sc-progress" id="sc-progress" onclick="scSeek(event)">
        <div class="sc-progress-fill" id="sc-progress-fill"></div>
      </div>
      ${spotifyUrl ? `<a class="sc-spotify" href="${spotifyUrl}" target="_blank" rel="noopener">↗ Spotify</a>` : ''}
    </div>` : (spotifyUrl ? `
    <div class="sc-footer" style="justify-content:flex-end">
      <a class="sc-spotify" href="${spotifyUrl}" target="_blank" rel="noopener">↗ Spotify</a>
    </div>` : '');

  window._scPreviewUrl = previewUrl;

  return `
  <div class="searched-card">
    <div class="sc-hero">
      ${imgHtml}
      <div class="sc-body">
        <div>
          <div class="sc-label">Buscando similares a</div>
          <div class="sc-name">${name}</div>
          <div class="sc-date">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="12" height="12" rx="1.5"/><path d="M5 1v3M11 1v3M2 7h12"/></svg>
            ${dateLabel}
          </div>
          ${scheduleHtml}
        </div>
        <div class="sc-tags">${tags.map(t => `<span class="sc-tag">${t}</span>`).join('')}</div>
        <div class="sc-stats">
          ${followers !== '—' ? `<div class="sc-stat"><strong>${followers}</strong> seguidores</div>` : ''}
          ${pop > 0 ? `<div class="sc-stat">popularidad <strong>${pop}/100</strong></div>` : ''}
        </div>
      </div>
    </div>
    ${footerHtml}
  </div>`;
}

function updateScBtn(playing) {
  const btn = document.getElementById('sc-play-btn');
  const icon = document.getElementById('sc-play-icon');
  if (!btn) return;
  btn.classList.toggle('playing', playing);
  icon.innerHTML = playing
    ? '<rect x="2" y="1" width="4" height="12" rx="1.5"/><rect x="8" y="1" width="4" height="12" rx="1.5"/>'
    : '<polygon points="3,1 13,7 3,13"/>';
}

function scTogglePlay() {
  if (!scAudio) {
    scAudio = new Audio(window._scPreviewUrl);
    scAudio.addEventListener('ended', () => {
      updateScBtn(false);
      clearInterval(scTimer);
      const fill = document.getElementById('sc-progress-fill');
      if (fill) fill.style.width = '0%';
      scAudio = null;
    });
  }

  if (scAudio.paused) {
    stopCurrentAudio(); // stop recommendation card audio if playing
    scAudio.play();
    updateScBtn(true);
    scTimer = setInterval(() => {
      if (scAudio && scAudio.duration) {
        const fill = document.getElementById('sc-progress-fill');
        if (fill) fill.style.width = (scAudio.currentTime / scAudio.duration * 100).toFixed(1) + '%';
      }
    }, 100);
  } else {
    scAudio.pause();
    updateScBtn(false);
    clearInterval(scTimer);
  }
}

function scSeek(e) {
  if (!scAudio || !scAudio.duration) return;
  const rect = document.getElementById('sc-progress').getBoundingClientRect();
  scAudio.currentTime = ((e.clientX - rect.left) / rect.width) * scAudio.duration;
}

// ── Main search ───────────────────────────────────────────────────────────
function runSearch() {
  const artist = document.getElementById('search-input').value.trim();
  const minTags = parseInt(document.getElementById('min-tags').value) || 2;
  const topDay  = parseInt(document.getElementById('top-per-day').value) || 10;

  if (!artist) { setStatus('Escribe un nombre de artista.', 'error'); return; }
  if (!df.length) { setStatus('Carga el CSV primero.', 'error'); return; }

  setStatus('Buscando...', 'loading');
  document.getElementById('results').innerHTML = '';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('artist-card-wrap').style.display = 'none';
  document.getElementById('artist-card-wrap').innerHTML = '';
  lastResults = {};

  if (scAudio) { scAudio.pause(); scAudio = null; clearInterval(scTimer); }

  setTimeout(() => {
    // Searched artist card
    const artistRow = df.find(r => normalize(r.artist) === normalize(artist));
    if (artistRow) {
      const wrap = document.getElementById('artist-card-wrap');
      wrap.innerHTML = renderArtistCard(artistRow);
      wrap.style.display = 'block';
    }

    const byDay = recommend(artist, minTags, topDay);
    lastResults = byDay;
    const dates = Object.keys(byDay).sort();

    if (!dates.length) {
      setStatus('', '');
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    const total = dates.reduce((s, d) => s + byDay[d].length, 0);
    setStatus(`${total} artistas recomendados para "${artist}"`, 'ok');
    renderResults(byDay);
  }, 50);
}

// ── Autocomplete ──────────────────────────────────────────────────────────
const searchInput = document.getElementById('search-input');
const acList = document.getElementById('autocomplete-list');
let acActive = -1;

searchInput.addEventListener('input', function() {
  const val = normalize(this.value);
  acList.innerHTML = '';
  acActive = -1;
  if (!val || !artistNames.length) { acList.style.display = 'none'; return; }
  const matches = artistNames.filter(n => normalize(n).includes(val)).slice(0, 8);
  if (!matches.length) { acList.style.display = 'none'; return; }
  matches.forEach(m => {
    const div = document.createElement('div');
    div.className = 'ac-item';
    div.textContent = m;
    div.onclick = () => { searchInput.value = m; acList.style.display = 'none'; runSearch(); };
    acList.appendChild(div);
  });
  acList.style.display = 'block';
});

searchInput.addEventListener('keydown', function(e) {
  const items = acList.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { acActive = Math.min(acActive + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === acActive)); }
  else if (e.key === 'ArrowUp') { acActive = Math.max(acActive - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === acActive)); }
  else if (e.key === 'Enter') { if (acActive >= 0) { searchInput.value = items[acActive].textContent; acList.style.display = 'none'; } runSearch(); }
  else if (e.key === 'Escape') { acList.style.display = 'none'; }
});

document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) acList.style.display = 'none'; });

// ── Layer 3: Spotify genres (for recommender) ─────────────────────────────
function findByGenres(artist, minShared) {
  const artistRow = df.find(r => normalize(r.artist) === normalize(artist));
  if (!artistRow || !artistRow.genres) return [];
  const artistGenres = new Set(
    artistRow.genres.split(',').map(g => normalize(g.trim())).filter(Boolean)
  );
  if (!artistGenres.size) return [];
  const results = [];
  for (const row of df) {
    if (!row.artist || normalize(row.artist) === normalize(artist)) continue;
    const candGenres = new Set(
      (row.genres || '').split(',').map(g => normalize(g.trim())).filter(Boolean)
    );
    const shared = [...artistGenres].filter(g => candGenres.has(g));
    if (shared.length < minShared) continue;
    const genreScore = shared.length / artistGenres.size;
    results.push({
      artist: row.artist, date: row.date || '',
      start_time: row.start_time || '', end_time: row.end_time || '', stage: row.stage || '',
      lastfm_score: 0, position: null,
      strength: genreScore * 0.3 * shared.length,
      source: 'genres',
      shared_tags: shared.join(' | '),
      lastfm_tags: row.lastfm_tags || '', popularity: row.popularity || '',
      image_url: row.image_url || '', spotify_url: row.spotify_url || '',
      preview_url: row.preview_url || '', top_track: row.top_track || '',
      followers: row.followers || '',
    });
  }
  return results;
}

// ── Genre Explorer ────────────────────────────────────────────────────────
function getAllGenresAndTags() {
  const genres = {};
  const tags = {};
  for (const row of df) {
    for (const g of (row.genres || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean)) {
      genres[g] = (genres[g] || 0) + 1;
    }
    for (const t of (row.lastfm_tags || '').split('|').map(s => s.trim().toLowerCase()).filter(Boolean)) {
      tags[t] = (tags[t] || 0) + 1;
    }
  }
  return { genres, tags };
}

function searchByGenreOrTag(query) {
  const q = normalize(query);
  if (!q) return [];
  const results = [];
  for (const row of df) {
    const genreMatch = (row.genres || '').split(',').some(g => normalize(g.trim()).includes(q));
    const tagMatch = (row.lastfm_tags || '').split('|').some(t => normalize(t.trim()).includes(q));
    if (genreMatch || tagMatch) {
      results.push({
        artist: row.artist, date: row.date || '',
        start_time: row.start_time || '', end_time: row.end_time || '',
        stage: row.stage || '', popularity: row.popularity || '',
        followers: row.followers || '', image_url: row.image_url || '',
        spotify_url: row.spotify_url || '', preview_url: row.preview_url || '',
        top_track: row.top_track || '', lastfm_tags: row.lastfm_tags || '',
        genres: row.genres || '',
        matchSource: genreMatch ? 'genre' : 'tag',
      });
    }
  }
  results.sort((a, b) => {
    const dateCmp = normDate(a.date).localeCompare(normDate(b.date));
    if (dateCmp !== 0) return dateCmp;
    return (parseInt(b.popularity) || 0) - (parseInt(a.popularity) || 0);
  });
  return results;
}

function renderGenreCard(r) {
  const isImg = r.image_url && r.image_url.startsWith('http');
  const hasPreview = r.preview_url && r.preview_url.startsWith('http');
  const pop = parseInt(r.popularity) || 0;
  const popClass = pop >= 65 ? 'high' : pop >= 35 ? 'mid' : 'low';

  const imgInner = isImg
    ? `<img class="artist-img" src="${r.image_url}" alt="${r.artist}" loading="lazy"
         onerror="this.style.display='none';this.nextSibling.style.display='flex'">
       <div class="artist-img-placeholder" style="display:none">${initials(r.artist)}</div>`
    : `<div class="artist-img-placeholder">${initials(r.artist)}</div>`;

  const overlayIcon = hasPreview
    ? `<div class="img-overlay">
         <div class="overlay-icon">${playIconSvg()}</div>
         <div class="wave-bars"><span></span><span></span><span></span><span></span><span></span></div>
         ${r.top_track ? `<div class="overlay-track">${r.top_track}</div>` : ''}
       </div>` : '';

  const previewAttrs = hasPreview
    ? `class="artist-img-wrap has-preview" onclick="onImgClick(this,'${r.preview_url}')" onmouseenter="onImgMouseEnter(this,'${r.preview_url}')" onmouseleave="onImgMouseLeave(this)"`
    : `class="artist-img-wrap"`;

  const scheduleHtml = (r.start_time || r.stage) ? `
    <div class="card-schedule">
      ${r.start_time ? `<span class="card-time">${r.start_time}${r.end_time ? ` → ${r.end_time}` : ''}</span>` : ''}
      ${r.start_time && r.stage ? `<span style="color:var(--border2);font-size:10px">·</span>` : ''}
      ${r.stage ? `<span class="card-stage">${r.stage}</span>` : ''}
    </div>` : '';

  const spotifyLink = r.spotify_url
    ? `<a href="${r.spotify_url}" target="_blank" rel="noopener" style="font-size:11px;color:var(--text-muted);text-decoration:none;">↗ Spotify</a>`
    : '';

  const genreTags = (r.genres || '').split(',').map(g => g.trim()).filter(Boolean).slice(0, 3)
    .map(g => `<span class="badge badge-tag">${g}</span>`).join('');

  const popHtml = pop > 0 ? `
    <div class="popularity-row">
      <span class="pop-label">pop</span>
      <div class="pop-bar"><div class="pop-fill ${popClass}" style="width:${pop}%"></div></div>
      <span class="pop-value">${pop}</span>
    </div>` : '';

  return `<div class="artist-card">
    <div ${previewAttrs}>${imgInner}${overlayIcon}</div>
    <div class="artist-info">
      <div class="artist-name">${r.artist}</div>
      ${scheduleHtml}
      <div class="artist-meta" style="margin-top:6px">${genreTags}</div>
    </div>
    ${(popHtml || spotifyLink) ? `<div class="artist-footer">
      ${popHtml}
      ${spotifyLink ? `<div class="preview-row" style="justify-content:flex-end">${spotifyLink}</div>` : ''}
    </div>` : ''}
  </div>`;
}

function runGenreSearch() {
  const q = document.getElementById('genre-input').value.trim();
  if (!q) return;
  const results = searchByGenreOrTag(q);
  const container = document.getElementById('genre-results');
  const statusEl = document.getElementById('genre-status');

  if (!results.length) {
    statusEl.textContent = `Sin resultados para "${q}"`;
    container.innerHTML = '';
    return;
  }

  // Group by date
  const byDay = {};
  for (const r of results) {
    if (!byDay[r.date]) byDay[r.date] = [];
    byDay[r.date].push(r);
  }

  const dates = Object.keys(byDay).sort((a, b) => normDate(a).localeCompare(normDate(b)));
  const total = results.length;
  statusEl.textContent = `${total} artista${total !== 1 ? 's' : ''} con "${q}"`;

  container.innerHTML = dates.map(date => {
    const items = byDay[date];
    // Sort by start_time within each day
    items.sort((a, b) => timeToMinutes(a.start_time) - timeToMinutes(b.start_time));
    return `<div class="day-block">
      <div class="day-header">
        <span class="day-label">${formatDate(date)}</span>
        <span class="day-count">${items.length} artistas</span>
      </div>
      <div class="artists-grid">${items.map(renderGenreCard).join('')}</div>
    </div>`;
  }).join('');
}

// Genre autocomplete suggestions
let genreAcActive = -1;
function initGenreAutocomplete() {
  const input = document.getElementById('genre-input');
  const acList = document.getElementById('genre-ac-list');
  if (!input || !acList) return;

  const { genres, tags } = getAllGenresAndTags();
  const allTerms = [
    ...Object.entries(genres).sort((a,b) => b[1]-a[1]).map(([k]) => k),
    ...Object.entries(tags).sort((a,b) => b[1]-a[1]).map(([k]) => k)
  ];
  const seen = new Set();
  const deduped = allTerms.filter(t => { if (seen.has(t)) return false; seen.add(t); return true; });

  input.addEventListener('input', function() {
    const val = normalize(this.value);
    acList.innerHTML = '';
    genreAcActive = -1;
    if (!val) { acList.style.display = 'none'; return; }
    const matches = deduped.filter(t => t.includes(val)).slice(0, 8);
    if (!matches.length) { acList.style.display = 'none'; return; }
    matches.forEach(m => {
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.textContent = m;
      div.onclick = () => { input.value = m; acList.style.display = 'none'; runGenreSearch(); };
      acList.appendChild(div);
    });
    acList.style.display = 'block';
  });

  input.addEventListener('keydown', function(e) {
    const items = acList.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') { genreAcActive = Math.min(genreAcActive+1, items.length-1); items.forEach((el,i) => el.classList.toggle('active', i===genreAcActive)); }
    else if (e.key === 'ArrowUp') { genreAcActive = Math.max(genreAcActive-1, 0); items.forEach((el,i) => el.classList.toggle('active', i===genreAcActive)); }
    else if (e.key === 'Enter') { if (genreAcActive >= 0) { input.value = items[genreAcActive].textContent; acList.style.display = 'none'; } runGenreSearch(); }
    else if (e.key === 'Escape') { acList.style.display = 'none'; }
  });

  document.addEventListener('click', (e) => { if (!e.target.closest('.genre-search-wrap')) acList.style.display = 'none'; });
}

// ── Auto-init ─────────────────────────────────────────────────────────────
(function initEmbedded() {
  df = EMBEDDED_DATA.map(r => {
    const row = {};
    for (const [k, v] of Object.entries(r)) row[k] = (v === null || v === undefined) ? '' : String(v);
    return row;
  });
  artistNames = df.map(r => r.artist).filter(Boolean);
  document.getElementById('initial-state').style.display = 'none';
  document.getElementById('app-area').style.display = 'block';
  setStatus('${df.length} artistas cargados — Primavera Sound 2026', 'ok');
  initGenreAutocomplete();
})();
</script>
